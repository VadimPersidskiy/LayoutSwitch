name: Build exe

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AutoHotkey v2 and Ahk2Exe
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.autohotkey.com/download/ahk-v2.zip -OutFile ahk.zip
          Expand-Archive ahk.zip -DestinationPath ahk
          $rel = Invoke-RestMethod https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile ahk2exe.zip
          Expand-Archive ahk2exe.zip -DestinationPath ahk2exe
          Get-ChildItem -Recurse ahk, ahk2exe | Select-Object -ExpandProperty FullName

      - name: Compile
        shell: pwsh
        run: |
          $base = (Get-ChildItem -Recurse ahk -Filter AutoHotkey64.exe | Select-Object -First 1).FullName
          $comp = (Get-ChildItem -Recurse ahk2exe -Filter Ahk2Exe.exe | Select-Object -First 1).FullName
          & $comp /in LayoutSwitch.ahk /out LayoutSwitch.exe /base $base /silent
          Start-Sleep -Seconds 3
          if (-not (Test-Path LayoutSwitch.exe)) { throw "LayoutSwitch.exe was not built" }

      - uses: actions/upload-artifact@v4
        with:
          name: LayoutSwitch
          path: LayoutSwitch.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LayoutSwitch.exe
